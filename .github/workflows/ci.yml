name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    # Меняем ubuntu-latest на windows-latest
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
      
    - name: Restore dependencies
      run: msbuild Laba1_PO.slnx -t:Restore
      
    - name: Build
      run: msbuild Laba1_PO.slnx -p:Configuration=Release
      
    - name: Test
      run: dotnet test Laba1_PO.slnx --no-build --verbosity normal